<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Consulta de retrabajo</title>
<style>
:root{--bg:#f3f5f8;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#dbe1ea;--ac:#2563eb;--rd:#dc2626;--gn:#16a34a;--am:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--cd:#1e293b;--tx:#e8edf5;--mu:#94a3b8;--bd:#334155;--ac:#60a5fa;--rd:#f87171;--gn:#4ade80;--am:#fbbf24}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 0 32px}
header{padding:14px 16px 10px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:20px}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.banner{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px;border:1px solid var(--am);color:var(--am);background:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ln{background:var(--cd);border:1px solid var(--bd);border-left:6px solid var(--lc,#64748b);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:84px}
.ln.on{outline:3px solid var(--ac)}
.ln b{display:block;font-size:15px}
.ln .n{font-size:34px;line-height:1.1;font-weight:700}
.ln small{color:var(--gn);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.t{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
button.t.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bd{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--rd);color:#fff;font-size:12px;margin-left:6px;text-align:center}
.mapwrap{overflow:auto;border:1px solid var(--bd);border-radius:10px;background:#fff;max-height:70vh;-webkit-overflow-scrolling:touch}
.mapin{position:relative;line-height:0}
.mapin img{width:100%;display:block}
.pin{position:absolute;border:3px solid var(--rd);background:rgba(220,38,38,.22);border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#7f1d1d;font-weight:700;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff;font-size:calc(var(--mw,600px)*0.014)}
.pin.hl{background:rgba(220,38,38,.5);box-shadow:0 0 0 4px rgba(37,99,235,.7)}
.mu{color:var(--mu);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:13px;color:var(--mu);font-weight:600}
tr.hl td{background:rgba(37,99,235,.18)}
.sv{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--bd)}
.sv.c{border-color:var(--rd);color:var(--rd)}
@media (max-width:620px){
 table,thead,tbody,tr,td{display:block}
 thead{display:none}
 tr{border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:6px 10px}
 td{border:0;padding:2px 0}
 td:before{content:attr(data-l) ": ";color:var(--mu);font-size:13px}
 tr.hl{outline:3px solid var(--ac)}
 tr.hl td{background:transparent}
}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:18px}
button.u{font:inherit;color:var(--ac);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
@media print{.noprint{display:none}}
</style>
</head>
<body>
<header>
 <h1>Retrabajo &middot; Rear Cradle</h1>
 <div class="sub" id="fecha">Cargando datos&hellip;</div>
</header>
<div class="wrap">
 <noscript><div class="banner">Esta p&aacute;gina necesita JavaScript activado.</div></noscript>
 <div id="aviso"></div>
 <div class="grid" id="lineas"></div>
 <div class="card">
  <div class="row noprint" style="justify-content:space-between;margin-bottom:8px">
   <div class="row" id="tabs"></div>
   <div class="row"><button class="t" id="zm" aria-label="Alejar">&minus;</button><button class="t" id="zp" aria-label="Acercar">+</button></div>
  </div>
  <div class="mapwrap" id="mw"><div class="mapin" id="mi"></div></div>
  <div class="mu" id="mnota" style="margin-top:6px"></div>
 </div>
 <div class="card">
  <b id="ttl">Puntos abiertos</b>
  <div id="tb" style="margin-top:6px"></div>
 </div>

    h+='<button class="t'+(pg===i?" on":"")+'" data-p="'+i+'">Plano '+(i+1)+(c?'<span class="bd">'+c+'</span>':"")+'</button>';
  }
  $("tabs").innerHTML=h;
}
$("tabs").onclick=function(e){
  var b=e.target;while(b&&b!==this&&!(b.getAttribute&&b.getAttribute("data-p")!==null))b=b.parentNode;
  if(!b||b===this)return;pg=parseInt(b.getAttribute("data-p"),10);firstScroll=true;pintaTabs();pintaMapa();
};
function ajustaFuente(){var mi=$("mi"),ps=mi.querySelectorAll(".pin"),i;mi.style.setProperty("--mw",mi.clientWidth+"px");for(i=0;i<ps.length;i++)ps[i].style.height=ps[i].offsetWidth+"px"}
function pintaMapa(){
  var m=setAbiertos(),h='<img alt="Plano '+(pg+1)+' de la pieza" src="'+MAPS[pg]+'">',j,q,n,fst=null;
  for(j=0;j<HOT[pg].length;j++){
    q=HOT[pg][j];n=String(q[0]);
    if(m[n]){
      if(!fst)fst=q;
      h+='<div class="pin" data-n="'+esc(n)+'" title="Cord\u00f3n '+esc(n)+'" style="left:'+((q[1]+q[3]/2)/10)+'%;top:'+((q[2]+q[4]/2)/10)+'%;width:5%;height:0">'+esc(n)+'</div>';
    }
  }
  $("mi").style.width=zoom+"%";$("mi").innerHTML=h;ajustaFuente();
  var tot={},k,fuera=0;
  for(j=0;j<HOT.length;j++)for(k=0;k<HOT[j].length;k++)tot[String(HOT[j][k][0])]=1;
  for(k in m)if(!tot[k])fuera++;
  $("mnota").textContent=fuera?fuera+" cord\u00f3n(es) abierto(s) no tienen ubicaci\u00f3n en los planos; aparecen en la tabla.":(fst?"Toca un c\u00edrculo para ver su detalle en la tabla.":"Sin puntos abiertos en este plano.");
  if(firstScroll&&fst){
    firstScroll=false;var w=$("mw"),im=$("mi");
    setTimeout(function(){w.scrollLeft=Math.max(0,(fst[1]+fst[3]/2)/1000*im.clientWidth-w.clientWidth/2);w.scrollTop=Math.max(0,(fst[2]+fst[4]/2)/1000*im.clientHeight-w.clientHeight/2)},30);
  }
}
$("mi").onclick=function(e){
  var n=e.target.getAttribute&&e.target.getAttribute("data-n");if(!n)return;
  var pins=this.querySelectorAll(".pin"),i;for(i=0;i<pins.length;i++)pins[i].classList.toggle("hl",pins[i]===e.target);
  var rs=$("tb").querySelectorAll("tr[data-c]"),first=null;
  for(i=0;i<rs.length;i++){var on=rs[i].getAttribute("data-c")===n;rs[i].classList.toggle("hl",on);if(on&&!first)first=rs[i]}
  if(first&&first.scrollIntoView)first.scrollIntoView({behavior:"smooth",block:"center"});
};
$("zp").onclick=function(){zoom=Math.min(400,zoom+60);pintaMapa()};
$("zm").onclick=function(){zoom=Math.max(100,zoom-60);pintaMapa()};
window.addEventListener("resize",ajustaFuente);
function pintaTabla(){
  var a=abiertos(),h,i,o;
  $("ttl").textContent="Puntos abiertos"+(filtro>=0?" \u00b7 "+D.l[filtro]:"")+" ("+a.length+")";
  if(!a.length){$("tb").innerHTML='<p class="mu" style="margin:6px 0">Sin puntos de retrabajo abiertos.</p>';return}
  h='<table><thead><tr><th>L\u00ednea</th><th>Cord\u00f3n</th><th>Defecto</th><th>Estaci\u00f3n</th><th>Severidad</th><th>Fecha</th></tr></thead><tbody>';
  for(i=0;i<a.length;i++){
    o=a[i];
    h+='<tr data-c="'+esc(o[1])+'"><td data-l="L\u00ednea">'+esc(D.l[o[0]]||"")+'</td><td data-l="Cord\u00f3n"><b>'+esc(o[1])+'</b></td><td data-l="Defecto">'+esc(o[2])+'</td><td data-l="Estaci\u00f3n">'+esc(o[3]||"\u2014")+'</td><td data-l="Severidad">'+(o[4]?'<span class="sv'+(o[4]==="Cr\u00edtico"?" c":"")+'">'+esc(o[4])+'</span>':"\u2014")+'</td><td data-l="Fecha">'+esc(o[5]||"\u2014")+'</td></tr>';
  }
  $("tb").innerHTML=h+"</tbody></table>";
}
$("rl").onclick=function(){$("fecha").textContent="Actualizando\u2026";firstScroll=true;load()};
load();
</script>
</body>
</html>
